<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org">

<head>
	<title>購入確認画面</title>
	<link rel="stylesheet" type="text/css" href="/css/style.css">
	<meta charset="utf-8" />
	<style>
		#lists {
			width: 50%;
		}
		.up {
			transform: translate(20px, -50px);
		}

		th {
			background-color: rgb(128, 255, 255);
			height: 25px;
			padding: 10px;
		}

		td {
			background-color: rgb(221, 254, 255);
			height: 25px;
			padding: 10px;
		}

		body {
			font-family: sans-serif;
		}
	</style>
</head>

<body>
	<div>[[${userData.userName}]]さん、ようこそ。</div><br><br><br>
	<div class="up">購入内容を確認してください</div><br><br>
	<table border="1" id="lists" class="up">
		<tr>
			<th>商品名</th>
			<th>価格</th>
			<th>個数</th>
			<th>小計</th>
		</tr>
		<tr th:each="item : ${itemList}">
			<td th:text="${item.itemName}"></td>
			<td th:text="${#numbers.formatInteger(item.itemValue, 3, 'COMMA')}+'円'"></td>
			<td th:text="${item.itemCount}+'個'"></td>
			<td th:text="${#numbers.formatInteger(item.itemSum, 3, 'COMMA')}+'円'"></td>
		</tr>
	</table><br>
	<table border="1" class="up">
		<tr>
			<th>合計金額</th>
			<td>[[${#numbers.formatInteger(itemSum, 3, 'COMMA')}]]円</td>
		</tr>
	</table><br><br>
	<form th:action="@{/shop/itemConfirm}" th:object="${ItemInputRequest}" th:method="POST">
		<div th:each="item, itemStat : ${itemList}">
			<input type="hidden" th:name="|itemList[${itemStat.index}].itemId|" th:value="${item.itemId}">
			<input type="hidden" th:name="|itemList[${itemStat.index}].itemValue|" th:value="${item.itemValue}">
			<input type="hidden" th:name="|itemList[${itemStat.index}].itemName|" th:value="${item.itemName}">
			<input type="hidden" th:name="|itemList[${itemStat.index}].itemCategory|" th:value="${item.itemCategory}">
			<input type="hidden" th:name="|itemList[${itemStat.index}].itemExplain|" th:value="${item.itemExplain}">
			<input type="hidden" th:name="|itemList[${itemStat.index}].itemSum|" th:value="${item.itemSum}">
			<input type="hidden" th:name="|itemList[${itemStat.index}].itemCount|" th:value="${item.itemCount}">
			<input type="hidden" th:name="|itemList[${itemStat.index}].itemNo|" th:value="${item.itemNo}">
		</div>
		<input type="button" onclick="history.back()" value="戻る" class="up">
		<button type="submit" class="up">購入する</button>
	</form>
</body>

</html>
